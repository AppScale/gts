<!--Body content-->
<style>
   table {border-collapse:collapse; table-layout:fixed; width:500px;}
   table td {border:solid 5px #fab; width:1000px; word-wrap:break-word; border-color:gray}
</style>
<script>
    function run(command) {
        alert('TEST')
    }
</script>

<div id="content">
    <div class="heading">
        <h3>Cron viewer</h3>
    </div>
    <div class="row-fluid">
        <div class="page-header">
            <h1>View cron tasks:</h1>
            <table>
                <tr>
                    <th>Cron job</th>
                    <th>Description</th>
                    <th>Frequency</th>
                </tr>
                {% for cron_job in cron_jobs%}
                    <tr>
                        <td id="command">{{cron_job['command']}}</td>
                        <td>{{cron_job['comment']}}</td>
                        <td>{{cron_job['frequency']}}</td>
                        <td><a class="btn btn-small" href="{{cron_job['url_command']}})">Run</a></td>
                    </tr>
                {% endfor %}
            </table>
        </div><!--close header-->
    </div> <!-- end row fluid -->
</div>
